services:
  # ============================================================================
  # 1. Backend Web Service (FastAPI)
  # ============================================================================
  - type: web
    name: shrnk-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BASE_URL
        sync: false # Set to your deployed backend URL (e.g. https://shrnk-backend.onrender.com)
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        value: sqlite:///./shrnk.db

  # ============================================================================
  # 2. Frontend Static Site (React + Vite)
  # ============================================================================
  - type: web
    name: shrnk-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to your backend URL (e.g. https://shrnk-backend.onrender.com)
      - key: VITE_BASE_URL
        sync: false # Set to your backend URL (e.g. https://shrnk-backend.onrender.com)
